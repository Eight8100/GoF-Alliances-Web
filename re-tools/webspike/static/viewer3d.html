<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoFA 3D viewer</title>
<style>
  html,body{margin:0;height:100%;background:#02060f;color:#cfe6f2;font:14px system-ui,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #bar{position:fixed;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:2;background:rgba(2,14,24,.72);padding:8px 10px;border-radius:8px;border:1px solid #17496a}
  button{background:#0a2b44;color:#cfe6f2;border:1px solid #1f6f9b;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
  button.on{background:#ff8a00;color:#111;border-color:#ffb000}
  #msg{position:fixed;left:12px;bottom:10px;z-index:2;color:#7fa7c0;max-width:70ch;font-size:12px}
  label{display:flex;gap:4px;align-items:center;color:#9fc3d8}
  details{color:#9fc3d8} details[open]{display:flex;flex-direction:column;gap:2px}
</style></head><body>
<canvas id="gl"></canvas>
<div id="bar"></div>
<div id="msg">Loading ...</div>
<script src="art.js"></script>
<script src="gofa3d.js"></script>
<script src="viewer3d.js"></script>
</body></html>
